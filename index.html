<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>talk saving app</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html-to-image のCDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="./icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f1f0e8;
      --bubble-bg: #ffffff;
      --topic-bg: #c1c1b3;
      --text-main: #333333;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      -webkit-touch-callout: default;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .app-bg {
      background-color: var(--bg-color);
    }

    .topic-bubble {
      background-color: var(--topic-bg);
      color: #ffffff;
      border-radius: 9999px;
      overflow: hidden;
      background-clip: padding-box;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .chat-bubble-text {
      line-height: 1.5;
      word-break: break-word;
      text-align: left;
      white-space: pre-wrap;
    }

    .chat-bubble-fix {
      border-radius: 1rem;
      overflow: hidden;
      background-clip: padding-box;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .dragging {
      opacity: 0.4;
      background: #e2e8f0 !important;
    }
    .drag-over {
      border-top: 2px dashed #6366f1 !important;
    }
  </style>
</head>
<body class="app-bg h-screen font-sans antialiased text-slate-800 flex items-center justify-center p-0 sm:p-4">

  <!-- アプリメインコンテナ -->
  <div id="mainAppContainer" class="app-bg w-full sm:max-w-md h-full sm:h-[844px] sm:rounded-[40px] sm:shadow-2xl flex flex-col overflow-hidden relative">

    <!-- ==================== 画面1：メンバーリスト ==================== -->
    <div id="screen-members" class="screen active">
      <div class="p-4 bg-transparent flex items-center justify-between relative shrink-0 z-10">
        <div class="relative">
          <button onclick="toggleGlobalMenu(event)" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 hover:bg-white/70 hover:text-slate-700 transition" aria-label="メニュー">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div id="globalContextMenu" class="absolute left-0 mt-1 hidden bg-white rounded-xl shadow-xl py-1 z-50 text-xs w-52 overflow-hidden border border-slate-100 whitespace-nowrap">
            <button onclick="exportBackup(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-file-export text-slate-400 w-4"></i> バックアップを書き出す
            </button>
            <button onclick="document.getElementById('backupImportInput').click(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-file-import text-slate-400 w-4"></i> バックアップを読み込む
            </button>
          </div>
          <input type="file" id="backupImportInput" accept="application/json,.json" class="hidden" onchange="importBackup(event)">
        </div>
        <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 -translate-x-1/2">メンバー</h1>
        <button onclick="openMemberModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="メンバー追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="px-4 py-2 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input type="text" id="searchMember" placeholder="メンバーを検索..." class="w-full bg-white/80 text-sm pl-9 pr-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <!-- メンバー一覧 -->
      <div class="flex-1 overflow-y-auto px-2 divide-y divide-slate-200/40 pb-4" id="memberList" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <!-- ==================== 画面2：イベントトーク一覧 ==================== -->
    <div id="screen-events" class="screen">
      <div class="p-4 flex items-center justify-between relative shrink-0 z-10">
        <button onclick="switchScreen('screen-members')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 -translate-x-1/2" id="eventScreenTitle">トークルーム</h1>
        <button onclick="openEventModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="イベント追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="px-4 py-2 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input type="text" id="searchEvent" placeholder="トークを検索..." class="w-full bg-white/80 text-sm pl-9 pr-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <!-- イベント一覧 -->
      <div class="flex-1 overflow-y-auto px-2 divide-y divide-slate-200/40 pb-4" id="eventRoomList" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <!-- ==================== 画面3：トークルーム ==================== -->
    <div id="screen-chat" class="screen">
      <div class="p-4 flex items-center justify-between relative shrink-0 z-10">
        <button onclick="switchScreen('screen-events')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 -translate-x-1/2" id="chatScreenTitle">トークルーム</h1>
        <button onclick="exportChatImage()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="トーク画像を保存">
          <i class="fa-solid fa-camera"></i>
        </button>
      </div>

      <!-- チャット画面全体のラッパー -->
      <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <div id="captureArea" class="flex-1 flex flex-col min-h-0 app-bg overflow-hidden">
          <div class="pt-3 pb-2 px-4 shrink-0 bg-transparent flex items-center justify-between mx-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-8 h-8 min-w-[32px] min-h-[32px] rounded-full bg-slate-200/80 shrink-0 flex items-center justify-center text-slate-600">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 448 512">
                  <path d="M152 64H296V24C296 10.75 306.7 0 320 0C333.3 0 344 10.75 344 24V64H384C419.3 64 448 92.65 448 128V416C448 451.3 419.3 480 384 480H64C28.65 480 0 451.3 0 416V128C0 92.65 28.65 64 64 64H104V24C104 10.75 114.7 0 128 0C141.3 0 152 10.75 152 24V64ZM400 192H48V416C48 424.8 55.16 432 64 432H384C392.8 432 400 424.8 400 416V192ZM384 112H64C55.16 112 48 119.2 48 128V144H400V128C400 119.2 392.8 112 384 112Z"/>
                </svg>
              </div>
              <div class="min-w-0">
                <div class="text-sm font-bold text-slate-800 truncate" id="chatEventDate">2026-04-29</div>
                <div class="text-xs text-slate-500 truncate" id="chatEventPlace">幕張メッセ 第1部</div>
              </div>
            </div>
            <div id="chatEventCount" class="text-right text-xs shrink-0 leading-tight hidden"></div>
          </div>

          <!-- メッセージエリア -->
          <div class="flex-1 p-4 overflow-y-auto space-y-1.5 min-h-0" id="chatMessages" style="-webkit-overflow-scrolling: touch;"></div>
        </div>
      </div>

      <div class="px-3 pt-4 pb-6 pl-4 pr-4 bg-transparent flex items-center gap-2 shrink-0 z-10">
        <button id="senderToggleBtn" onclick="toggleSenderMode()" class="w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-sm shrink-0 transition bg-white text-xs font-bold text-slate-700">
          <span id="senderToggleLabel">メンバー</span>
        </button>
        <input type="text" id="messageInput" placeholder="メッセージを入力..." class="flex-1 bg-slate-200/70 text-sm px-4 py-3.5 rounded-full focus:bg-white focus:outline-none transition">
        <button onclick="sendMessage()" class="text-slate-600 hover:text-slate-800 px-2 text-xl">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="fixed inset-0 bg-black/80 hidden flex-col items-center justify-center p-2 sm:p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-sm h-[90vh] p-4 flex flex-col shadow-2xl relative">
      <div class="flex items-center justify-between mb-2 shrink-0">
        <h3 class="text-sm font-bold text-slate-800">トーク画像（長押しで保存）</h3>
        <button onclick="closeImagePreviewModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto bg-slate-100 rounded-xl p-2 flex items-center justify-center min-h-0" style="-webkit-overflow-scrolling: touch;">
        <img id="previewImageElement" src="" alt="Generated Chat Image" class="w-full h-auto rounded shadow object-contain" style="-webkit-touch-callout: default !important; -webkit-user-select: auto !important; user-select: auto !important; touch-action: auto !important; pointer-events: auto !important;">
      </div>
      <button onclick="closeImagePreviewModal()" class="mt-3 shrink-0 w-full py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold">閉じる</button>
    </div>
  </div>

  <!-- モーダル各種 -->
  <div id="memberModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="memberModalTitle">メンバー追加</h3>
      <input type="hidden" id="editMemberId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">名前</label>
          <input type="text" id="inputMemberName" placeholder="例: 矢吹奈子" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">グループ名</label>
          <input type="text" id="inputMemberRole" placeholder="例: IZ*ONE" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">アイコン画像</label>
          <input type="file" id="inputMemberFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <input type="text" id="inputMemberAvatarUrl" placeholder="または画像URLを入力" class="w-full bg-slate-50 rounded-lg p-2 mt-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex items-center justify-between mt-5">
        <button type="button" id="deleteMemberBtnInModal" onclick="deleteMemberFromModal()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg hidden">削除</button>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="closeMemberModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveMember()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="eventModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="eventModalTitle">イベント追加</h3>
      <input type="hidden" id="editEventId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">日付</label>
          <input type="text" id="inputEventDate" placeholder="例: 2026-04-29" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">場所</label>
          <input type="text" id="inputEventPlace" placeholder="例: 幕張メッセ" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">部</label>
          <input type="text" id="inputEventSection" placeholder="例: 第1部" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">枚数</label>
          <input type="number" id="inputEventCount" min="1" step="1" placeholder="例: 3" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex items-center justify-between mt-5">
        <button type="button" id="deleteEventBtnInModal" onclick="deleteEventFromModal()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg hidden">削除</button>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="closeEventModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveEvent()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- メッセージ編集モーダル（削除ボタンを削除） -->
  <div id="msgEditModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4">メッセージの編集</h3>
      <input type="hidden" id="editMsgId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">送信者</label>
          <select id="editMsgSender" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="them">メンバー</option>
            <option value="me">自分</option>
            <option value="topic">トピック</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">メッセージ内容</label>
          <textarea id="editMsgText" rows="3" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
        </div>
      </div>
      <div class="flex items-center justify-end mt-5">
        <div class="flex items-center gap-2">
          <button onclick="closeMsgEditModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveEditedMessage()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- メッセージ用タップポップアップメニュー -->
  <div id="msgActionMenu" class="fixed hidden bg-white rounded-xl shadow-xl py-1 z-50 text-xs w-40 overflow-hidden border border-slate-100">
    <button onclick="msgAction('edit')" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集する
    </button>
    <button onclick="msgAction('up')" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-arrow-up text-slate-400 w-4"></i> 上へ移動
    </button>
    <button onclick="msgAction('down')" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-arrow-down text-slate-400 w-4"></i> 下へ移動
    </button>
    <button onclick="msgAction('delete')" class="w-full text-left px-3 py-2.5 hover:bg-red-50 flex items-center gap-2 text-red-600 border-t border-slate-100">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除する
    </button>
  </div>

  <!-- メンバー用コンテキストメニュー -->
  <div id="memberContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl py-1 z-50 text-xs w-36 overflow-hidden">
    <button onclick="memberContextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="memberContextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <!-- イベント用コンテキストメニュー -->
  <div id="eventContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl py-1 z-50 text-xs w-36 overflow-hidden">
    <button onclick="eventContextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="eventContextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
    <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
    <span id="toastMsg">処理中...</span>
  </div>

  <script>
    let membersData = JSON.parse(localStorage.getItem('idol_talk_members')) || [];
    let currentMemberId = null;
    let currentEventId = null;
    let senderMode = 'them';
    let selectedMemberIdForContext = null;
    let selectedEventIdForContext = null;
    let selectedMsgIdForContext = null;

    function saveData() {
      localStorage.setItem('idol_talk_members', JSON.stringify(membersData));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-members') renderMemberList();
      if (screenId === 'screen-events') renderEventList();
      if (screenId === 'screen-chat') renderChatMessages();
    }

    function toggleGlobalMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('globalContextMenu');
      closeAllContextMenus();
      menu.classList.toggle('hidden');
    }

    function closeAllContextMenus() {
      const menu = document.getElementById('globalContextMenu');
      if (menu) menu.classList.add('hidden');
      const mMenu = document.getElementById('memberContextMenu');
      if (mMenu) mMenu.classList.add('hidden');
      const eMenu = document.getElementById('eventContextMenu');
      if (eMenu) eMenu.classList.add('hidden');
      const msgMenu = document.getElementById('msgActionMenu');
      if (msgMenu) msgMenu.classList.add('hidden');
    }
    document.addEventListener('click', () => closeAllContextMenus());

    // ==================== ドラッグ＆ドロップ共通設定（メンバー・イベント用） ====================
    let draggedId = null;

    function setupDragAndDrop(element, handleElement, id, listType) {
      handleElement.setAttribute('draggable', 'true');
      handleElement.classList.add('drag-handle');

      handleElement.addEventListener('dragstart', (e) => {
        draggedId = id;
        e.dataTransfer.setData('text/plain', id);
        setTimeout(() => element.classList.add('dragging'), 0);
      });

      handleElement.addEventListener('dragend', () => {
        element.classList.remove('dragging');
        draggedId = null;
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      element.addEventListener('dragover', (e) => {
        e.preventDefault();
        element.classList.add('drag-over');
      });

      element.addEventListener('dragleave', () => {
        element.classList.remove('drag-over');
      });

      element.addEventListener('drop', (e) => {
        e.preventDefault();
        element.classList.remove('drag-over');
        if (!draggedId || draggedId === id) return;

        if (listType === 'member') {
          const fromIdx = membersData.findIndex(m => m.id === draggedId);
          const toIdx = membersData.findIndex(m => m.id === id);
          if (fromIdx !== -1 && toIdx !== -1) {
            const [moved] = membersData.splice(fromIdx, 1);
            membersData.splice(toIdx, 0, moved);
            saveData();
            renderMemberList(document.getElementById('searchMember').value.trim());
          }
        } else if (listType === 'event') {
          const member = membersData.find(m => m.id === currentMemberId);
          if (!member) return;
          const fromIdx = member.events.findIndex(ev => ev.id === draggedId);
          const toIdx = member.events.findIndex(ev => ev.id === id);
          if (fromIdx !== -1 && toIdx !== -1) {
            const [moved] = member.events.splice(fromIdx, 1);
            member.events.splice(toIdx, 0, moved);
            saveData();
            renderEventList(document.getElementById('searchEvent').value.trim());
          }
        }
      });
    }

      if (!event) return;

      document.getElementById('chatScreenTitle').textContent = `${member.name}`;
      document.getElementById('chatEventDate').textContent = event.date || '日付未設定';
      document.getElementById('chatEventPlace').textContent = [event.place, event.section].filter(Boolean).join(' ') || '場所未設定';

        countEl.innerHTML = `<span class="bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded-md inline-flex items-center"><svg class="w-3 h-3 fill-current mr-1 inline-block align-middle" viewBox="0 0 576 512"><path d="M0 128C0 92.7 28.7 64 64 64H512c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128zm128 64V320c0 8.8 7.2 16 16 16H432c8.8 0 16-7.2 16-16V192c0-8.8-7.2-16-16-16H144c-8.8 0-16 7.2-16 16 z"/></svg>${escapeHtml(event.count)}枚</span>`;
        countEl.classList.remove('hidden');
      } else {
        countEl.innerHTML = '';
        countEl.classList.add('hidden');
      }

      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = '';

      event.messages.forEach((msg, index) => {
        const prev = event.messages[index-1];
        const isContinue = prev && prev.sender==='them' && msg.sender==='them';

        msgEl.className = 'py-1 flex flex-col items-center w-full';

        let innerContent = '';
        if (msg.sender === 'topic') {
          innerContent = `
            <div class="flex-1 w-full flex justify-center items-center my-0.5">
              <div class="topic-bubble text-xs py-1.5 px-4 w-fit max-w-[85%] text-center shadow-sm chat-bubble-text cursor-pointer" onclick="openMsgActionMenu(event, '${msg.id}')">${escapeHtml(msg.text)}</div>
            </div>`;

          innerContent = `
            <div class="flex-1 w-full flex justify-end my-0.5">
              <div class="w-fit max-w-[75%] bg-white text-slate-800 text-sm py-2 px-4 chat-bubble-fix rounded-tr-none shadow-sm text-left chat-bubble-text cursor-pointer" onclick="openMsgActionMenu(event, '${msg.id}')">${escapeHtml(msg.text)}</div>

          innerContent = `
            <div class="flex-1 w-full flex items-start my-0.5 gap-2">
              ${isContinue ? '<div class="w-8 shrink-0"></div>' : `<img src="${member.avatar}" crossorigin="anonymous" class="w-8 h-8 rounded-full object-cover shrink-0 mt-0.5">`}
              <div class="w-fit max-w-[75%]">

              </div>
            </div>`;
        }

        msgEl.innerHTML = innerContent;
        messagesContainer.appendChild(msgEl);
      });

    function saveMember() {
      const editId = document.getElementById('editMemberId').value;
      const name = document.getElementById('inputMemberName').value.trim();
      const role = document.getElementById('inputMemberRole').value.trim();
      const url = document.getElementById('inputMemberAvatarUrl').value.trim();
      const fileInput = document.getElementById('inputMemberFile');
      if (!name) return;

      const proceedSave = (avatarUrl) => {
        let finalAvatar = avatarUrl || url;
        if (!finalAvatar && editId) {
          const m = membersData.find(item => item.id === editId);
          if (m) finalAvatar = m.avatar;
        }
        finalAvatar = finalAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80';

        if (editId) {
          const member = membersData.find(m => m.id === editId);
          if (member) { member.name = name; member.role = role; member.avatar = finalAvatar; }
        } else {
          membersData.push({ id: 'm_' + Date.now(), name, role: role || 'アイドル', avatar: finalAvatar, events: [] });
        }
        saveData();
        closeMemberModal();
        renderMemberList();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => proceedSave(e.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        proceedSave(null);
      }
    }

    function openMsgEditModal(msgId) {
      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      const msg = event.messages.find(m => m.id === msgId);
      if (!msg) return;

      document.getElementById('editMsgId').value = msg.id;
      document.getElementById('editMsgSender').value = msg.sender;
      document.getElementById('editMsgText').value = msg.text;

      const modal = document.getElementById('msgEditModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeMsgEditModal() {
      document.getElementById('msgEditModal').classList.remove('flex');
      document.getElementById('msgEditModal').classList.add('hidden');
    }

    function saveEditedMessage() {
      const msgId = document.getElementById('editMsgId').value;
      const sender = document.getElementById('editMsgSender').value;
      const text = document.getElementById('editMsgText').value.trim();
      if (!text) return;

      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      const msg = event.messages.find(m => m.id === msgId);
      if (msg) {
        msg.sender = sender;
        msg.text = text;
        saveData();
        closeMsgEditModal();
        renderChatMessages();
      }
    }

    function moveMessageOrder(msgId, direction) {
      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      const idx = event.messages.findIndex(m => m.id === msgId);
      if (idx === -1) return;

      if (direction === 'up' && idx > 0) {
        const temp = event.messages[idx];
        event.messages[idx] = event.messages[idx - 1];
        event.messages[idx - 1] = temp;
      } else if (direction === 'down' && idx < event.messages.length - 1) {
        const temp = event.messages[idx];
        event.messages[idx] = event.messages[idx + 1];
        event.messages[idx + 1] = temp;
      }
      saveData();
      renderChatMessages();
    }

    function toggleSenderMode() {
      if (senderMode === 'them') senderMode = 'me';
      else if (senderMode === 'me') senderMode = 'topic';
      else senderMode = 'them';
      updateSenderToggleUI();
    }

    function updateSenderToggleUI() {
      const btn = document.getElementById('senderToggleBtn');
      const member = membersData.find(m => m.id === currentMemberId);
      if (senderMode === 'them') {
        btn.className = "w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-sm shrink-0 transition bg-white text-xs font-bold text-slate-700";
        btn.innerHTML = member ? `<img src="${member.avatar}" crossorigin="anonymous" class="w-full h-full object-cover">` : 'メンバー';
      } else if (senderMode === 'me') {
        btn.className = "w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-sm shrink-0 transition bg-[#f1f0e8] text-slate-500";
        btn.innerHTML = '<i class="fa-solid fa-user text-sm"></i>';
      } else {
        btn.className = "w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-sm shrink-0 transition bg-slate-200/70";
        btn.innerHTML = '';
      }
    }

    function exportBackup() {
      const backup = { version: 1, exportedAt: new Date().toISOString(), members: membersData };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `member-talk-backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('バックアップファイルを書き出しました');
      setTimeout(hideToast, 2000);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const backup = JSON.parse(reader.result);
          const importedMembers = Array.isArray(backup) ? backup : backup.members;
          if (!Array.isArray(importedMembers)) throw new Error();
          if (!confirm('現在のすべてのデータを置き換えます。よろしいですか？')) return;
          membersData = importedMembers;
          currentMemberId = null;
          currentEventId = null;
          saveData();
          switchScreen('screen-members');
          showToast('バックアップを読み込みました');
          setTimeout(hideToast, 2000);
        } catch {
          alert('ファイルを読み込めませんでした。');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentMemberId || !currentEventId) return;

      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      const now = new Date();
      event.messages.push({
        id: 'msg_' + Date.now(),
        sender: senderMode,
        text,
        time: `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`
      });
      saveData();
      input.value = '';
      renderChatMessages();
    }

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('searchMember').addEventListener('input', (e) => renderMemberList(e.target.value.trim()));
    document.getElementById('searchEvent').addEventListener('input', (e) => renderEventList(e.target.value.trim()));

    function exportChatImage() {
      const captureElement = document.getElementById('captureArea');
      const mainAppContainer = document.getElementById('mainAppContainer');
      const chatScreen = document.getElementById('screen-chat');
      const messagesContainer = document.getElementById('chatMessages');
      if (!captureElement) return;

      showToast('画像を生成中...');

      const origMainHeight = mainAppContainer.style.height;
      const origScreenHeight = chatScreen.style.height;
      const origCaptureHeight = captureElement.style.height;
      const origMsgHeight = messagesContainer.style.height;
      const origMsgOverflow = messagesContainer.style.overflow;

      mainAppContainer.style.height = 'auto';
      chatScreen.style.height = 'auto';
      captureElement.style.height = 'auto';
      messagesContainer.style.height = messagesContainer.scrollHeight + 'px';
      messagesContainer.style.overflow = 'visible';

      setTimeout(() => {
        htmlToImage.toPng(captureElement, { cacheBust: true, pixelRatio: 2, fontEmbedCSS: '' })
          .then((dataUrl) => {
            mainAppContainer.style.height = origMainHeight;
            chatScreen.style.height = origScreenHeight;
            captureElement.style.height = origCaptureHeight;
            messagesContainer.style.height = origMsgHeight;
            messagesContainer.style.overflow = origMsgOverflow;

            hideToast();
            const modal = document.getElementById('imagePreviewModal');
            document.getElementById('previewImageElement').src = dataUrl;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          })
          .catch(() => {
            mainAppContainer.style.height = origMainHeight;
            chatScreen.style.height = origScreenHeight;
            captureElement.style.height = origCaptureHeight;
            messagesContainer.style.height = origMsgHeight;
            messagesContainer.style.overflow = origMsgOverflow;
            hideToast();
            showToast('画像の保存に失敗しました');
            setTimeout(hideToast, 2000);
          });
      }, 200);
    }

    function closeImagePreviewModal() {
      const modal = document.getElementById('imagePreviewModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    renderMemberList();
  </script>
</body>
</html>
