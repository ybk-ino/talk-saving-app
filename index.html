<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>talk saving app</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html-to-image のCDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f1f0e8;
      --bubble-bg: #ffffff;
      --topic-bg: #c1c1b3;
      --text-main: #333333;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .app-bg {
      background-color: var(--bg-color);
    }

    .topic-bubble {
      background-color: var(--topic-bg);
      color: #ffffff;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .chat-bubble-text {
      line-height: 1.5;
      word-break: break-word;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="bg-slate-900 h-screen font-sans antialiased text-slate-800 flex items-center justify-center p-0 sm:p-4">

  <!-- アプリメインコンテナ -->
  <div id="mainAppContainer" class="app-bg w-full max-w-md h-full sm:h-[90vh] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-300">

    <!-- ==================== 画面1：メンバーリスト ==================== -->
    <div id="screen-members" class="screen active">
      <!-- ヘッダー -->
      <div class="p-4 bg-transparent flex items-center justify-center relative">
        <h1 class="text-lg font-bold text-slate-800">メンバー</h1>
        <div class="absolute right-3 flex items-center gap-1">
          <button onclick="exportBackup()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 hover:bg-white/70 hover:text-slate-700 transition" aria-label="バックアップを書き出す">
            <i class="fa-solid fa-file-export"></i>
          </button>
          <button onclick="document.getElementById('backupImportInput').click()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 hover:bg-white/70 hover:text-slate-700 transition" aria-label="バックアップを読み込む">
            <i class="fa-solid fa-file-import"></i>
          </button>
          <input type="file" id="backupImportInput" accept="application/json,.json" class="hidden" onchange="importBackup(event)">
        </div>
      </div>

      <!-- 検索バー -->
      <div class="px-4 py-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input type="text" id="searchMember" placeholder="メンバーを検索..." class="w-full bg-white/80 text-sm pl-9 pr-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <!-- メンバー一覧 -->
      <div class="flex-1 overflow-y-auto px-2 divide-y divide-slate-200/40" id="memberList">
        <!-- JSで動的描画 -->
      </div>

      <!-- フローティング追加ボタン -->
      <button onclick="openMemberModal()" class="absolute bottom-6 right-6 w-14 h-14 bg-white text-slate-800 rounded-full shadow-lg flex items-center justify-center text-2xl font-light hover:bg-slate-50 transition border border-slate-200">
        <i class="fa-solid fa-plus text-slate-700"></i>
      </button>
    </div>

    <!-- ==================== 画面2：イベントトーク一覧 ==================== -->
    <div id="screen-events" class="screen">
      <!-- ヘッダー -->
      <div class="p-4 flex items-center justify-between relative">
        <button onclick="switchScreen('screen-members')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 -translate-x-1/2" id="eventScreenTitle">トークルーム</h1>
        <div class="w-6"></div>
      </div>

      <!-- 検索バー -->
      <div class="px-4 py-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input type="text" id="searchEvent" placeholder="トークを検索..." class="w-full bg-white/80 text-sm pl-9 pr-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <div class="px-4 pt-2 text-xs font-semibold text-slate-500"></div>

      <!-- イベント一覧 -->
      <div class="flex-1 overflow-y-auto px-2 divide-y divide-slate-200/40" id="eventRoomList">
        <!-- JSで動的描画 -->
      </div>

      <!-- フローティング追加ボタン -->
      <button onclick="openEventModal()" class="absolute bottom-6 right-6 w-14 h-14 bg-white text-slate-800 rounded-full shadow-lg flex items-center justify-center text-2xl font-light hover:bg-slate-50 transition border border-slate-200">
        <i class="fa-solid fa-plus text-slate-700"></i>
      </button>
    </div>

    <!-- ==================== 画面3：トークルーム ==================== -->
    <div id="screen-chat" class="screen">
      <!-- ヘッダー -->
      <div class="p-4 flex items-center justify-between bg-transparent shrink-0 relative">
        <button onclick="switchScreen('screen-events')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 -translate-x-1/2" id="chatScreenTitle">トークルーム</h1>
        <button onclick="exportChatImage()" class="text-slate-600 hover:text-slate-900 text-base px-2" aria-label="トーク画像を保存">
          <i class="fa-solid fa-camera"></i>
        </button>
      </div>

      <!-- キャプチャ対象エリア -->
      <div id="captureArea" class="flex-1 flex flex-col min-h-0 app-bg overflow-hidden">
        <!-- イベントタイトル（カレンダーアイコン付き） -->
        <div class="pt-3 pb-2 px-4 shrink-0 bg-transparent flex items-center justify-between mx-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-8 h-8 min-w-[32px] min-h-[32px] rounded-full bg-slate-200/80 border border-slate-200 shrink-0 flex items-center justify-center text-slate-600">
              <!-- カレンダーアイコン（SVG） -->
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 448 512">
                <path d="M152 64H296V24C296 10.75 306.7 0 320 0C333.3 0 344 10.75 344 24V64H384C419.3 64 448 92.65 448 128V416C448 451.3 419.3 480 384 480H64C28.65 480 0 451.3 0 416V128C0 92.65 28.65 64 64 64H104V24C104 10.75 114.7 0 128 0C141.3 0 152 10.75 152 24V64ZM400 192H48V416C48 424.8 55.16 432 64 432H384C392.8 432 400 424.8 400 416V192ZM384 112H64C55.16 112 48 119.2 48 128V144H400V128C400 119.2 392.8 112 384 112Z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <div class="text-xs font-bold text-slate-800 truncate" id="chatEventDate">2026-04-29</div>
              <div class="text-[11px] text-slate-500 truncate" id="chatEventPlace">幕張メッセ 第1部</div>
            </div>
          </div>
          <div id="chatEventCount" class="text-right text-xs shrink-0 leading-tight hidden"></div>
        </div>

        <!-- メッセージエリア -->
        <div class="flex-1 p-4 overflow-y-auto space-y-3 min-h-0" id="chatMessages">
          <!-- JSで動的描画 -->
        </div>
      </div>

      <!-- メッセージ入力欄 -->
      <div class="p-3 bg-transparent border-t border-slate-200/60 flex items-center gap-2 shrink-0">
        <!-- 送信者切替ボタン -->
        <button id="senderToggleBtn" onclick="toggleSenderMode()" class="w-10 h-10 rounded-full flex items-center justify-center overflow-hidden border border-slate-300 shadow-sm shrink-0 transition bg-white text-xs font-bold text-slate-700">
          <span id="senderToggleLabel">メンバー</span>
        </button>

        <input type="text" id="messageInput" placeholder="メッセージを入力..." class="flex-1 bg-slate-200/70 text-sm px-4 py-2.5 rounded-full border border-transparent focus:bg-white focus:outline-none transition">

        <button onclick="sendMessage()" class="text-slate-600 hover:text-slate-800 px-2 text-xl">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- モーダル：メンバー追加・編集 -->
  <div id="memberModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="memberModalTitle">メンバー追加</h3>
      <input type="hidden" id="editMemberId">
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">名前</label>
          <input type="text" id="inputMemberName" placeholder="例: 矢吹奈子" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">グループ名</label>
          <input type="text" id="inputMemberRole" placeholder="例: IZ*ONE" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">アイコン画像</label>
          <input type="file" id="inputMemberFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <input type="text" id="inputMemberAvatarUrl" placeholder="または画像URLを入力" class="w-full border border-slate-200 rounded-lg p-2 mt-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-5">
        <button onclick="closeMemberModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
        <button onclick="saveMember()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
      </div>
    </div>
  </div>

  <!-- モーダル：イベント追加・編集 -->
  <div id="eventModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="eventModalTitle">イベント追加</h3>
      <input type="hidden" id="editEventId">

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">日付</label>
          <input type="text" id="inputEventDate" placeholder="例: 2026-04-29" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">場所</label>
          <input type="text" id="inputEventPlace" placeholder="例: 幕張メッセ" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">部</label>
          <input type="text" id="inputEventSection" placeholder="例: 第1部" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">枚数</label>
          <input type="number" id="inputEventCount" min="1" step="1" placeholder="例: 3" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-5">
        <button onclick="closeEventModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
        <button onclick="saveEvent()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
      </div>
    </div>
  </div>

  <!-- モーダル：メッセージ編集 -->
  <div id="msgEditModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4">メッセージの編集</h3>
      <input type="hidden" id="editMsgId">
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">送信者</label>
          <select id="editMsgSender" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="them">メンバー</option>
            <option value="me">自分</option>
            <option value="topic">トピック</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">メッセージ内容</label>
          <textarea id="editMsgText" rows="3" class="w-full border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-5">
        <button onclick="closeMsgEditModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
        <button onclick="saveEditedMessage()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
      </div>
    </div>
  </div>

  <!-- コンテキストメニュー（メッセージ用） -->
  <div id="msgContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl border border-slate-200 py-1 z-50 text-xs w-32 overflow-hidden select-none">
    <button onclick="contextAction('up')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-chevron-up text-slate-400 w-4"></i> 上へ移動
    </button>
    <button onclick="contextAction('down')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-chevron-down text-slate-400 w-4"></i> 下へ移動
    </button>
    <button onclick="contextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="contextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600 border-t border-slate-100">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <!-- コンテキストメニュー（メンバーリスト用） -->
  <div id="memberContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl border border-slate-200 py-1 z-50 text-xs w-36 overflow-hidden select-none">
    <button onclick="memberContextAction('up')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-chevron-up text-slate-400 w-4"></i> 上へ移動
    </button>
    <button onclick="memberContextAction('down')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-chevron-down text-slate-400 w-4"></i> 下へ移動
    </button>
    <button onclick="memberContextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700 border-t border-slate-100">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="memberContextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600 border-t border-slate-100">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <!-- コンテキストメニュー（イベントリスト用） -->
  <div id="eventContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl border border-slate-200 py-1 z-50 text-xs w-36 overflow-hidden select-none">
    <button onclick="eventContextAction('up')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-chevron-up text-slate-400 w-4"></i> 上へ移動
    </button>
    <button onclick="eventContextAction('down')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-chevron-down text-slate-400 w-4"></i> 下へ移動
    </button>
    <button onclick="eventContextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700 border-t border-slate-100">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="eventContextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600 border-t border-slate-100">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
    <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
    <span id="toastMsg">処理中...</span>
  </div>

  <script>
    // デフォルト・ローカルストレージデータ
    let membersData = JSON.parse(localStorage.getItem('idol_talk_members')) || [];

    // アプリ状態
    let currentMemberId = null;
    let currentEventId = null;
    let senderMode = 'them'; // 'them' | 'me' | 'topic'
    let selectedMsgIdForContext = null;
    let selectedMemberIdForContext = null;
    let selectedEventIdForContext = null;
    let longTouchTimer = null;
    let memberLongTouchTimer = null;
    let eventLongTouchTimer = null;

    // ストレージへ保存
    function saveData() {
      localStorage.setItem('idol_talk_members', JSON.stringify(membersData));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // 画面切り替え制御
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-members') renderMemberList();
      if (screenId === 'screen-events') renderEventList();
      if (screenId === 'screen-chat') renderChatMessages();
    }

    // メンバーリスト描画
    function renderMemberList(filter = '') {
      const listEl = document.getElementById('memberList');
      listEl.innerHTML = '';

      const filtered = membersData.filter(m => m.name.includes(filter) || m.role.includes(filter));

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">メンバーがいません</div>`;
        return;
      }

      filtered.forEach(member => {
        const item = document.createElement('div');
        item.className = 'py-3 px-3 flex items-center justify-between cursor-pointer hover:bg-white/40 rounded-xl transition group select-none';

        item.setAttribute('oncontextmenu', `openMemberContextMenu(event, '${member.id}')`);
        item.setAttribute('ontouchstart', `handleMemberTouchStart(event, '${member.id}')`);
        item.setAttribute('ontouchend', `handleMemberTouchEnd()`);
        item.setAttribute('ontouchmove', `handleMemberTouchMove()`);

        item.innerHTML = `
          <div class="flex items-center gap-3.5 flex-1 min-w-0" onclick="selectMember('${member.id}')">
            <img src="${member.avatar}" class="w-12 h-12 rounded-full object-cover border border-slate-200 shrink-0" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80';">
            <div class="truncate">
              <h3 class="text-base font-bold text-slate-800 truncate">${escapeHtml(member.name)}</h3>
              <p class="text-xs text-slate-500 truncate">${escapeHtml(member.role)}</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 ml-2 shrink-0">
            <button onclick="openMemberContextMenu(event, '${member.id}'); event.stopPropagation();" class="w-8 h-8 rounded-none bg-transparent text-slate-500 hover:text-slate-700 transition flex items-center justify-center" aria-label="${escapeHtml(member.name)}のメニュー">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>
          </div>
        `;

        listEl.appendChild(item);
      });
    }

    function selectMember(memberId) {
      currentMemberId = memberId;
      const member = membersData.find(m => m.id === memberId);
      document.getElementById('eventScreenTitle').textContent = `${member.name}`;
      switchScreen('screen-events');
    }

    function saveMember() {
      const editId = document.getElementById('editMemberId').value;
      const name = document.getElementById('inputMemberName').value.trim();
      const role = document.getElementById('inputMemberRole').value.trim();
      const url = document.getElementById('inputMemberAvatarUrl').value.trim();
      const fileInput = document.getElementById('inputMemberFile');

      if (!name) return;

      const proceedSave = (avatarUrl) => {
        let finalAvatar = avatarUrl || url;
        if (!finalAvatar && editId) {
          const existingMember = membersData.find(m => m.id === editId);
          if (existingMember) {
            finalAvatar = existingMember.avatar;
          }
        }
        finalAvatar = finalAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80';

        if (editId) {
          const member = membersData.find(m => m.id === editId);
          if (member) {
            member.name = name;
            member.role = role;
            member.avatar = finalAvatar;
          }
        } else {
          membersData.push({
            id: 'm_' + Date.now(),
            name,
            role: role || 'アイドル',
            avatar: finalAvatar,
            events: []
          });
        }

        saveData();
        closeMemberModal();
        renderMemberList();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => proceedSave(e.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        proceedSave(null);
      }
    }

    // チャット画面描画
    function renderChatMessages() {
      const member = membersData.find(m => m.id === currentMemberId);
      if (!member) return;
      const event = member.events.find(e => e.id === currentEventId);
      if (!event) return;

      document.getElementById('chatScreenTitle').textContent = `${member.name}`;

      const placeText = event.place ? event.place : '';
      const sectionText = event.section ? event.section : '';
      const placeAndSection = [placeText, sectionText].filter(Boolean).join(' ') || '';

      document.getElementById('chatEventDate').textContent = event.date || '日付未設定';
      document.getElementById('chatEventPlace').textContent = placeAndSection || '場所未設定';

      const countEl = document.getElementById('chatEventCount');
      if (event.count) {
        countEl.innerHTML = `<span class="bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded-md"><i class="fa-solid fa-ticket text-[10px] mr-1"></i>${escapeHtml(event.count)}枚</span>`;
        countEl.classList.remove('hidden');
      } else {
        countEl.innerHTML = '';
        countEl.classList.add('hidden');
      }

      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = '';

      event.messages.forEach((msg, index) => {
        const prev = event.messages[index-1];
        const isContinue = prev && prev.sender==='them' && msg.sender==='them';
        const msgEl = document.createElement('div');

        const eventHandlers = `
          oncontextmenu="openContextMenu(event, '${msg.id}')"
          ontouchstart="handleTouchStart(event, '${msg.id}')"
          ontouchend="handleTouchEnd()"
          ontouchmove="handleTouchMove()"
        `;

        if (msg.sender === 'topic') {
          msgEl.className = 'flex justify-center items-center my-2 select-none cursor-pointer';
          msgEl.innerHTML = `<div ${eventHandlers} class="topic-bubble text-xs py-1.5 px-4 rounded-full w-fit max-w-[85%] text-center shadow-sm chat-bubble-text">${escapeHtml(msg.text)}</div>`;
        } else if (msg.sender === 'me') {
          msgEl.className = 'flex justify-end my-1.5 select-none cursor-pointer';
          msgEl.innerHTML = `<div ${eventHandlers} class="w-fit max-w-[75%] bg-white text-slate-800 text-sm py-2 px-4 rounded-2xl rounded-tr-none shadow-sm text-left chat-bubble-text">${escapeHtml(msg.text)}</div>`;
        } else {
          msgEl.className = 'select-none cursor-pointer';
          msgEl.innerHTML = `
          <div class="flex items-start my-1.5 gap-2">
            ${isContinue ? '<div class="w-8 shrink-0"></div>' : `<img src="${member.avatar}" class="w-8 h-8 rounded-full object-cover shrink-0 mt-0.5">`}
            <div class="w-fit max-w-[75%]">
              ${isContinue ? '' : `<div class="text-[11px] text-slate-500 mb-0.5 ml-1 font-medium">${escapeHtml(member.name)}</div>`}
              <div ${eventHandlers} class="bg-white text-slate-800 text-sm py-2 px-4 rounded-2xl rounded-tl-none shadow-sm chat-bubble-text">${escapeHtml(msg.text)}</div>
            </div>
          </div>`;
        }

        messagesContainer.appendChild(msgEl);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      updateSenderToggleUI();
    }

    // チャット画面（スクロール領域含む）を画像として保存する関数
    function exportChatImage() {
      const captureElement = document.getElementById('captureArea');
      const mainAppContainer = document.getElementById('mainAppContainer');
      const chatScreen = document.getElementById('screen-chat');
      if (!captureElement) return;

      showToast('画像を生成中...');

      const messagesContainer = document.getElementById('chatMessages');

      const origMainHeight = mainAppContainer.style.height;
      const origMainOverflow = mainAppContainer.style.overflow;
      const origScreenHeight = chatScreen.style.height;
      const origScreenOverflow = chatScreen.style.overflow;
      
      const origCaptureHeight = captureElement.style.height;
      const origCaptureOverflow = captureElement.style.overflow;
      const origMsgHeight = messagesContainer.style.height;
      const origMsgOverflow = messagesContainer.style.overflow;

      mainAppContainer.style.height = 'auto';
      mainAppContainer.style.overflow = 'visible';
      chatScreen.style.height = 'auto';
      chatScreen.style.overflow = 'visible';

      captureElement.style.height = 'auto';
      captureElement.style.overflow = 'visible';

      messagesContainer.style.height = messagesContainer.scrollHeight + 'px';
      messagesContainer.style.overflow = 'visible';

      setTimeout(() => {
        htmlToImage.toPng(captureElement, { 
          cacheBust: true, 
          pixelRatio: 2,
          fontEmbedCSS: '',
          filter: (node) => {
            return node.tagName !== 'SCRIPT';
          }
        })
          .then((dataUrl) => {
            mainAppContainer.style.height = origMainHeight;
            mainAppContainer.style.overflow = origMainOverflow;
            chatScreen.style.height = origScreenHeight;
            chatScreen.style.overflow = origScreenOverflow;

            captureElement.style.height = origCaptureHeight;
            captureElement.style.overflow = origCaptureOverflow;

            messagesContainer.style.height = origMsgHeight;
            messagesContainer.style.overflow = origMsgOverflow;

            const link = document.createElement('a');
            const member = membersData.find(m => m.id === currentMemberId);
            const event = member ? member.events.find(e => e.id === currentEventId) : null;
            const dateStr = event && event.date ? event.date : 'talk';
            const memberName = member && member.name ? member.name : 'member';

            link.download = `${memberName}_${dateStr}.png`;
            link.href = dataUrl;
            link.click();

            showToast('画像を保存しました');
            setTimeout(hideToast, 2000);
          })
          .catch((error) => {
            mainAppContainer.style.height = origMainHeight;
            mainAppContainer.style.overflow = origMainOverflow;
            chatScreen.style.height = origScreenHeight;
            chatScreen.style.overflow = origScreenOverflow;

            captureElement.style.height = origCaptureHeight;
            captureElement.style.overflow = origCaptureOverflow;

            messagesContainer.style.height = origMsgHeight;
            messagesContainer.style.overflow = origMsgOverflow;

            console.error('oops, something went wrong!', error);
            showToast('画像の保存に失敗しました');
            setTimeout(hideToast, 2000);
          });
      }, 100);
    }

    function contextAction(type) {
      if (!selectedMsgIdForContext) return;
      const msgId = selectedMsgIdForContext;
      closeAllContextMenus();

      if (type === 'up') moveMessage(msgId, 'up');
      else if (type === 'down') moveMessage(msgId, 'down');
      else if (type === 'edit') openMsgEditModal(msgId);
      else if (type === 'delete') deleteMessage(msgId);

        openMemberModal(memberId);

        deleteMember(memberId);

    function moveMember(memberId, direction) {
      const index = membersData.findIndex(m => m.id === memberId);
      if (index === -1) return;

      if (direction === 'up' && index > 0) {
        const temp = membersData[index];
        membersData[index] = membersData[index - 1];
        membersData[index - 1] = temp;
      } else if (direction === 'down' && index < membersData.length - 1) {
        const temp = membersData[index];
        membersData[index] = membersData[index + 1];
        membersData[index + 1] = temp;
      } else {
        return;
      }

      saveData();
      renderMemberList(document.getElementById('searchMember').value.trim());
    }

      const member = membersData.find(m => m.id === currentMemberId);
      if (!member) return;
      const index = member.events.findIndex(e => e.id === eventId);
      if (index === -1) return;

      if (direction === 'up' && index > 0) {
        const temp = member.events[index];
        member.events[index] = member.events[index - 1];
        member.events[index - 1] = temp;
      } else if (direction === 'down' && index < member.events.length - 1) {
        const temp = member.events[index];
        member.events[index] = member.events[index + 1];
        member.events[index + 1] = temp;

    }

    function updateSenderToggleUI() {
      const btn = document.getElementById('senderToggleBtn');
      const member = membersData.find(m => m.id === currentMemberId);

      if (senderMode === 'them') {
        btn.className = "w-10 h-10 rounded-full flex items-center justify-center overflow-hidden border border-slate-300 shadow-sm shrink-0 transition bg-white text-xs font-bold text-slate-700";
        btn.innerHTML = member ? `<img src="${member.avatar}" class="w-full h-full object-cover">` : 'メンバー';
      } else if (senderMode === 'me') {
        btn.className = "w-10 h-10 rounded-full flex items-center justify-center overflow-hidden border border-slate-300 shadow-sm shrink-0 transition bg-[#f1f0e8] text-slate-500";
        btn.innerHTML = '<i class="fa-solid fa-user text-sm"></i>';
      } else {
        btn.className = "w-10 h-10 rounded-full flex items-center justify-center overflow-hidden border border-slate-300 shadow-sm shrink-0 transition bg-slate-200/70";
        btn.innerHTML = '';
      }
    }

    function exportBackup() {
      const backup = {
        version: 1,
        exportedAt: new Date().toISOString(),
        members: membersData
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = `member-talk-backup_${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast('バックアップを保存しました');
      setTimeout(hideToast, 2000);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const backup = JSON.parse(reader.result);
          const importedMembers = Array.isArray(backup) ? backup : backup.members;
          if (!Array.isArray(importedMembers)) throw new Error('invalid backup');
          if (!confirm('現在のすべてのデータをバックアップの内容で置き換えます。よろしいですか？')) return;

          membersData = importedMembers;
          currentMemberId = null;
          currentEventId = null;
          saveData();
          switchScreen('screen-members');
          showToast('バックアップを読み込みました');
          setTimeout(hideToast, 2000);
        } catch (error) {
          alert('バックアップファイルを読み込めませんでした。JSONファイルを確認してください。');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentMemberId || !currentEventId) return;

      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);

      const now = new Date();
      const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      event.messages.push({
        id: 'msg_' + Date.now(),
        sender: senderMode,
        text,
        time: timeStr
      });

      event.lastMsg = text;

      saveData();
      input.value = '';
      renderChatMessages();
    }

    // イベントバインド
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('searchMember').addEventListener('input', (e) => {
      renderMemberList(e.target.value.trim());
    });
    document.getElementById('searchEvent').addEventListener('input', (e) => {
      renderEventList(e.target.value.trim());
    });

    // 初期化
    renderMemberList();
  </script>
</body>
</html>
